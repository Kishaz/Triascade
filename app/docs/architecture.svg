<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1480" height="2130" viewBox="0 0 1480 2130"
     font-family="Helvetica, Arial, sans-serif">
  <!-- CascadeScope method + results poster. Reuses manuscript Figure 1 panels B and C;
       house palette; American English; no em-dashes. Panel text is live; plots/panels are linked images. -->
  <rect width="1480" height="2130" fill="#ffffff"/>

  <!-- header -->
  <text x="28" y="44" font-size="30" font-weight="700"><tspan fill="#6A2C5A">CascadeScope</tspan><tspan fill="#000000" font-size="20" font-weight="400">&#160;&#160;reading the anti-tumor immune cascade, one patient at a time</tspan></text>

  <!-- ===================== 1. the cascade (Figure 1 panel C) ===================== -->
  <text x="28" y="84" font-size="19" font-weight="700" fill="#000000">1&#160;&#160;The immune cascade we read</text>
  <image xlink:href="fig1c.png" x="24" y="98" width="1432" height="548"/>

  <!-- ===================== 2. from the panel to the patient ===================== -->
  <text x="28" y="678" font-size="19" font-weight="700" fill="#000000">2&#160;&#160;From the 98-gene panel to a patient call</text>

  <!-- left: Figure 1 panel B (modules -> layers) -->
  <image xlink:href="fig1b.png" x="24" y="694" width="700" height="556"/>

  <!-- pipeline connectors -->
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#000000"/></marker>
  </defs>
  <line x1="1102" y1="872" x2="1102" y2="890" stroke="#000000" stroke-width="2.4" marker-end="url(#ah)"/>
  <line x1="1102" y1="1108" x2="1102" y2="1126" stroke="#000000" stroke-width="2.4" marker-end="url(#ah)"/>

  <!-- a. input data -->
  <rect x="748" y="694" width="708" height="176" rx="7" fill="#F3EDF2" stroke="#6A2C5A" stroke-width="2"/>
  <text x="768" y="724" font-size="17" font-weight="700" fill="#000000">a&#160;&#160;Your data (the input)</text>
  <!-- mini gene x sample table -->
  <rect x="768" y="736" width="278" height="24" fill="#EDE2EA" stroke="#cccccc" stroke-width="1"/>
  <rect x="768" y="760" width="278" height="72" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <line x1="872" y1="736" x2="872" y2="832" stroke="#cccccc"/><line x1="930" y1="736" x2="930" y2="832" stroke="#cccccc"/><line x1="988" y1="736" x2="988" y2="832" stroke="#cccccc"/>
  <line x1="768" y1="760" x2="1046" y2="760" stroke="#cccccc"/><line x1="768" y1="784" x2="1046" y2="784" stroke="#cccccc"/><line x1="768" y1="808" x2="1046" y2="808" stroke="#cccccc"/>
  <text x="776" y="753" font-size="13" font-weight="700" fill="#000000">gene</text><text x="889" y="753" font-size="13" font-weight="700" fill="#000000">S1</text><text x="947" y="753" font-size="13" font-weight="700" fill="#000000">S2</text><text x="1005" y="753" font-size="13" font-weight="700" fill="#000000">S3</text>
  <text x="776" y="777" font-size="13" fill="#000000">CXCL9</text><text x="889" y="777" font-size="13" fill="#000000">2.4</text><text x="947" y="777" font-size="13" fill="#000000">0.1</text><text x="1005" y="777" font-size="13" fill="#000000">3.1</text>
  <text x="776" y="801" font-size="13" fill="#000000">TGFB1</text><text x="889" y="801" font-size="13" fill="#000000">0.3</text><text x="947" y="801" font-size="13" fill="#000000">2.8</text><text x="1005" y="801" font-size="13" fill="#000000">0.2</text>
  <text x="776" y="825" font-size="13" fill="#000000">GZMB</text><text x="889" y="825" font-size="13" fill="#000000">3.0</text><text x="947" y="825" font-size="13" fill="#000000">0.2</text><text x="1005" y="825" font-size="13" fill="#000000">2.6</text>
  <text x="1076" y="760" font-size="14" fill="#000000">Tumor RNA-seq (TPM / log / counts).</text>
  <text x="1076" y="784" font-size="14" fill="#000000">gene &#215; sample table:</text>
  <text x="1076" y="806" font-size="14" fill="#000000">CSV / TSV / Excel.</text>
  <text x="1076" y="828" font-size="14" font-weight="700" fill="#000000">one patient = one column.</text>

  <!-- b. score vs frozen reference -->
  <rect x="748" y="890" width="708" height="216" rx="7" fill="#F3EDF2" stroke="#6A2C5A" stroke-width="2"/>
  <text x="768" y="920" font-size="17" font-weight="700" fill="#000000">b&#160;&#160;Score each gene against a frozen reference</text>
  <text x="768" y="946" font-size="14" fill="#000000">Self-normalize the sample; a gene is <tspan font-weight="700">ON</tspan> if at or above the frozen reference median.</text>
  <rect x="768" y="958" width="668" height="32" rx="5" fill="#ffffff" stroke="#cccccc"/>
  <text x="782" y="980" font-size="15" font-weight="700" fill="#000000">layer score = (activating genes ON) &#8722; (suppressive genes ON)</text>
  <rect x="768" y="998" width="668" height="32" rx="5" fill="#ffffff" stroke="#cccccc"/>
  <text x="782" y="1020" font-size="15" font-weight="700" fill="#000000">z = (layer score &#8722; reference mean) / reference SD</text>
  <text x="768" y="1058" font-size="14" fill="#000000">Standardized versus the reference population (0 = median, SD units).</text>
  <text x="768" y="1082" font-size="13.5" fill="#555555">Scored one patient at a time, independent of any cohort.</text>

  <!-- c. archetype call -->
  <rect x="748" y="1126" width="708" height="124" rx="7" fill="#F3EDF2" stroke="#6A2C5A" stroke-width="2"/>
  <text x="768" y="1154" font-size="16" font-weight="700" fill="#000000">c&#160;&#160;Call the archetype: the lowest layer (z &lt; &#8722;0.5)</text>
  <rect x="768" y="1172" width="18" height="18" rx="3" fill="#2E7D32"/><text x="794" y="1187" font-size="14.5"><tspan font-weight="700" fill="#000000">Immune-engaged</tspan><tspan fill="#000000">&#160;&#160;(hot)</tspan></text>
  <rect x="1098" y="1172" width="18" height="18" rx="3" fill="#9C7A3E"/><text x="1124" y="1187" font-size="14.5"><tspan font-weight="700" fill="#000000">Cold</tspan><tspan fill="#000000">&#160;&#160;(Sensory)</tspan></text>
  <rect x="768" y="1206" width="18" height="18" rx="3" fill="#6A2C5A"/><text x="794" y="1221" font-size="14.5"><tspan font-weight="700" fill="#000000">Blocked</tspan><tspan fill="#000000">&#160;&#160;(Integration)</tspan></text>
  <rect x="1098" y="1206" width="18" height="18" rx="3" fill="#B2567E"/><text x="1124" y="1221" font-size="14.5"><tspan font-weight="700" fill="#000000">No-kill</tspan><tspan fill="#000000">&#160;&#160;(Execution)</tspan></text>

  <!-- ===================== 3. results (real app outputs, house palette) ===================== -->
  <text x="28" y="1286" font-size="19" font-weight="700" fill="#000000">3&#160;&#160;What CascadeScope produces&#160;&#160;<tspan font-weight="400" font-size="16">(example cohort, n = 60)</tspan></text>

  <rect x="24" y="1302" width="704" height="378" rx="8" fill="#ffffff" stroke="#6A2C5A" stroke-width="2"/>
  <text x="44" y="1332" font-size="16" font-weight="700" fill="#000000">Patient report: three-layer gauge</text>
  <image xlink:href="fig_gauge.png" x="40" y="1377" width="672" height="249"/>

  <rect x="752" y="1302" width="704" height="378" rx="8" fill="#ffffff" stroke="#6A2C5A" stroke-width="2"/>
  <text x="772" y="1332" font-size="16" font-weight="700" fill="#000000">Gene drivers: per-patient cascade tree</text>
  <image xlink:href="fig_tree.png" x="768" y="1372" width="672" height="259"/>

  <rect x="24" y="1704" width="704" height="378" rx="8" fill="#ffffff" stroke="#6A2C5A" stroke-width="2"/>
  <text x="44" y="1734" font-size="16" font-weight="700" fill="#000000">Cohort explorer: archetype mix</text>
  <image xlink:href="fig_donut.png" x="56" y="1741" width="640" height="310"/>

  <rect x="752" y="1704" width="704" height="378" rx="8" fill="#ffffff" stroke="#6A2C5A" stroke-width="2"/>
  <text x="772" y="1734" font-size="16" font-weight="700" fill="#000000">Cohort explorer: per-patient layer scores</text>
  <image xlink:href="fig_beeswarm.png" x="768" y="1764" width="672" height="280"/>

  <!-- footer -->
  <line x1="24" y1="2102" x2="1456" y2="2102" stroke="#e5e5e5" stroke-width="1"/>
  <text x="24" y="2122" font-size="13.5" fill="#000000"><tspan font-weight="700" fill="#6A2C5A">Reproducible:</tspan> frozen, versioned 98-gene reference; deterministic, cohort-independent scoring.&#160;&#160;&#160;<tspan font-weight="700" fill="#9C7A3E">Research use only</tspan>, not a validated clinical test.</text>
</svg>
