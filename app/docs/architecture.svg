<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1400" height="1520" viewBox="0 0 1400 1520"
     font-family="Helvetica, Arial, sans-serif">
  <!-- CascadeScope method + results poster. Figure-1 house style; high-contrast palette;
       American English; no em-dashes. Panel text is live <text> (editable); plots are linked images. -->
  <rect width="1400" height="1520" fill="#ffffff"/>

  <!-- ===================== header ===================== -->
  <text x="28" y="44" font-size="30" font-weight="700"><tspan fill="#6A2C5A">CascadeScope</tspan><tspan fill="#000000" font-size="20" font-weight="400">&#160;&#160;reading the anti-tumor immune cascade, one patient at a time</tspan></text>

  <!-- ===================== 1. the three layers ===================== -->
  <text x="28" y="92" font-size="19" font-weight="700" fill="#000000">1&#160;&#160;The three-layer cascade we read</text>

  <!-- Sensory -->
  <rect x="24" y="104" width="1352" height="92" rx="7" fill="#FBEAD9" stroke="#D95F02" stroke-width="2"/>
  <text x="46" y="142" font-size="21" font-weight="700" fill="#D95F02">SENSORY</text>
  <text x="46" y="170" font-size="15" font-style="italic" fill="#000000">Is the tumor seen?</text>
  <text x="330" y="150" font-size="15"><tspan font-weight="700" fill="#000000">+ Antigen presentation / IFN</tspan><tspan fill="#000000">&#160;&#160;(21 genes)</tspan></text>
  <text x="330" y="176" font-size="14.5" fill="#000000">CXCL9, STAT1, B2M, HLA-A, TAP1, PSMB8, IRF1, IFNG, JAK1</text>

  <!-- Integration -->
  <rect x="24" y="202" width="1352" height="92" rx="7" fill="#E1EEF6" stroke="#1F78B4" stroke-width="2"/>
  <text x="46" y="240" font-size="21" font-weight="700" fill="#1F78B4">INTEGRATION</text>
  <text x="46" y="268" font-size="15" font-style="italic" fill="#000000">Do immune cells get in?</text>
  <text x="330" y="240" font-size="15"><tspan font-weight="700" fill="#000000">+ Trafficking / adhesion</tspan><tspan fill="#000000">&#160;(21):&#160;&#160;CCL5, CXCR3, ICAM1, CCL19, CD40</tspan></text>
  <text x="330" y="268" font-size="15"><tspan font-weight="700" fill="#000000">&#8722; Stroma / Treg exclusion</tspan><tspan fill="#000000">&#160;(20):&#160;&#160;TGFB1, FAP, COL1A1, VEGFA, MMP9</tspan></text>

  <!-- Execution -->
  <rect x="24" y="300" width="1352" height="92" rx="7" fill="#EAE2F0" stroke="#6A51A3" stroke-width="2"/>
  <text x="46" y="338" font-size="21" font-weight="700" fill="#6A51A3">EXECUTION</text>
  <text x="46" y="366" font-size="15" font-style="italic" fill="#000000">Do they kill?</text>
  <text x="330" y="338" font-size="15"><tspan font-weight="700" fill="#000000">+ Cytotoxic effector, CD8 T &amp; NK</tspan><tspan fill="#000000">&#160;(19):&#160;&#160;GZMB, PRF1, GNLY, NKG7, CD8A</tspan></text>
  <text x="330" y="366" font-size="15"><tspan font-weight="700" fill="#000000">&#8722; Exhaustion / checkpoint</tspan><tspan fill="#000000">&#160;(19):&#160;&#160;PD-1, CTLA4, LAG3, TIGIT, TOX</tspan></text>

  <!-- ===================== 2. formula + 3. archetypes ===================== -->
  <!-- Box 2: how we score it -->
  <rect x="24" y="424" width="690" height="250" rx="7" fill="#F3EDF2" stroke="#6A2C5A" stroke-width="2"/>
  <text x="44" y="456" font-size="19" font-weight="700" fill="#000000">2&#160;&#160;How we score it</text>
  <text x="44" y="488" font-size="14.5" fill="#000000">Self-normalize each sample across the panel genes.</text>
  <text x="44" y="512" font-size="14.5" fill="#000000">A gene is <tspan font-weight="700">ON</tspan> if it is at or above the frozen reference median.</text>
  <rect x="44" y="528" width="650" height="34" rx="5" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="58" y="551" font-size="15" font-weight="700" fill="#000000">layer score = (activating genes ON) &#8722; (suppressive genes ON)</text>
  <rect x="44" y="572" width="650" height="34" rx="5" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="58" y="595" font-size="15" font-weight="700" fill="#000000">z = (layer score &#8722; reference mean) / reference SD</text>
  <text x="44" y="636" font-size="14.5" fill="#000000">The <tspan font-weight="700">lowest layer</tspan> (when z &lt; &#8722;0.5) names the archetype.</text>
  <text x="44" y="660" font-size="13.5" fill="#555555">Scored one patient at a time, independent of any cohort.</text>

  <!-- Box 3: the four archetypes -->
  <rect x="730" y="424" width="646" height="250" rx="7" fill="#F3EDF2" stroke="#6A2C5A" stroke-width="2"/>
  <text x="750" y="456" font-size="19" font-weight="700" fill="#000000">3&#160;&#160;The four archetypes</text>
  <rect x="752" y="476" width="22" height="22" rx="4" fill="#1B9E77"/>
  <text x="784" y="493" font-size="15"><tspan font-weight="700" fill="#000000">Immune-engaged</tspan><tspan fill="#000000">&#160;&#160;inflamed / hot.  No single lowest layer.</tspan></text>
  <rect x="752" y="520" width="22" height="22" rx="4" fill="#1F78B4"/>
  <text x="784" y="537" font-size="15"><tspan font-weight="700" fill="#000000">Cold</tspan><tspan fill="#000000">&#160;&#160;immune-desert.  Lowest layer: Sensory.</tspan></text>
  <rect x="752" y="564" width="22" height="22" rx="4" fill="#E6550D"/>
  <text x="784" y="581" font-size="15"><tspan font-weight="700" fill="#000000">Blocked</tspan><tspan fill="#000000">&#160;&#160;immune-excluded.  Lowest layer: Integration.</tspan></text>
  <rect x="752" y="608" width="22" height="22" rx="4" fill="#6A51A3"/>
  <text x="784" y="625" font-size="15"><tspan font-weight="700" fill="#000000">No-kill</tspan><tspan fill="#000000">&#160;&#160;inflamed-dysfunctional.  Lowest layer: Execution.</tspan></text>
  <text x="752" y="660" font-size="13.5" fill="#555555">The archetype is the lowest layer; colors match the plots below.</text>

  <!-- ===================== 4. results (real app outputs) ===================== -->
  <text x="28" y="716" font-size="19" font-weight="700" fill="#000000">4&#160;&#160;What CascadeScope produces&#160;&#160;<tspan font-weight="400" font-size="16">(example cohort, n = 60)</tspan></text>

  <!-- (1,1) Patient gauge -->
  <rect x="24" y="732" width="664" height="352" rx="8" fill="#ffffff" stroke="#6A2C5A" stroke-width="2"/>
  <text x="44" y="762" font-size="16" font-weight="700" fill="#000000">Patient report: three-layer gauge</text>
  <image xlink:href="fig_gauge.png" x="40" y="800" width="632" height="234"/>

  <!-- (1,2) Gene drivers tree -->
  <rect x="712" y="732" width="664" height="352" rx="8" fill="#ffffff" stroke="#6A2C5A" stroke-width="2"/>
  <text x="732" y="762" font-size="16" font-weight="700" fill="#000000">Gene drivers: per-patient cascade tree</text>
  <image xlink:href="fig_tree.png" x="728" y="796" width="632" height="244"/>

  <!-- (2,1) Cohort donut -->
  <rect x="24" y="1100" width="664" height="352" rx="8" fill="#ffffff" stroke="#6A2C5A" stroke-width="2"/>
  <text x="44" y="1130" font-size="16" font-weight="700" fill="#000000">Cohort explorer: archetype mix</text>
  <image xlink:href="fig_donut.png" x="56" y="1145" width="600" height="291"/>

  <!-- (2,2) Cohort beeswarm -->
  <rect x="712" y="1100" width="664" height="352" rx="8" fill="#ffffff" stroke="#6A2C5A" stroke-width="2"/>
  <text x="732" y="1130" font-size="16" font-weight="700" fill="#000000">Cohort explorer: per-patient layer scores</text>
  <image xlink:href="fig_beeswarm.png" x="730" y="1162" width="628" height="262"/>

  <!-- ===================== footer ===================== -->
  <line x1="24" y1="1486" x2="1376" y2="1486" stroke="#e5e5e5" stroke-width="1"/>
  <text x="24" y="1506" font-size="13.5" fill="#000000"><tspan font-weight="700" fill="#6A2C5A">Reproducible:</tspan> frozen, versioned 98-gene reference; deterministic, cohort-independent scoring.&#160;&#160;&#160;<tspan font-weight="700" fill="#9C7A3E">Research use only</tspan>, not a validated clinical test.</text>
</svg>
