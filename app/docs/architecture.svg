<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="1030" viewBox="0 0 1200 1030"
     font-family="Helvetica, Arial, sans-serif">
  <!-- CascadeScope "how it works": Figure-1-style framed panels with the app's real outputs
       embedded as teasers. Panel titles are live <text> (editable); plots are linked images. -->
  <rect width="1200" height="1030" fill="#ffffff"/>
  <text x="24" y="38" font-size="24" font-weight="700"><tspan fill="#6A2C5A">CascadeScope</tspan><tspan fill="#000000" font-weight="700" font-size="18">&#160;&#160;&#183;&#160;&#160;how it works</tspan></text>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#000000"/>
    </marker>
  </defs>

  <!-- ===================== pipeline (a -> b -> c) ===================== -->
  <!-- connectors: black, square (straight) with arrowheads -->
  <line x1="382" y1="120" x2="420" y2="120" stroke="#000000" stroke-width="2.4" marker-end="url(#ah)"/>
  <line x1="780" y1="120" x2="818" y2="120" stroke="#000000" stroke-width="2.4" marker-end="url(#ah)"/>

  <!-- a Input -->
  <rect x="24" y="58" width="356" height="124" rx="8" fill="#F3EDF2" stroke="#6A2C5A" stroke-width="2"/>
  <text x="44" y="92" font-size="17" font-weight="700" fill="#000000">a &#160; Input</text>
  <text x="44" y="120" font-size="14" fill="#000000">Tumor RNA-seq &#8212; TPM / log / counts</text>
  <text x="44" y="142" font-size="14" fill="#000000">gene &#215; sample &#183; CSV / TSV / Excel</text>
  <text x="44" y="164" font-size="14" fill="#000000">one patient = one column</text>

  <!-- b Score -->
  <rect x="422" y="58" width="356" height="124" rx="8" fill="#F3EDF2" stroke="#6A2C5A" stroke-width="2"/>
  <text x="442" y="92" font-size="17" font-weight="700" fill="#000000">b &#160; Score vs a frozen reference</text>
  <text x="442" y="120" font-size="14" fill="#000000">per-sample self-normalization</text>
  <text x="442" y="142" font-size="14" fill="#000000">98-gene locked panel</text>
  <text x="442" y="164" font-size="14" fill="#000000">cohort-independent (one patient OK)</text>

  <!-- c Cascade -->
  <rect x="820" y="58" width="356" height="124" rx="8" fill="#F3EDF2" stroke="#6A2C5A" stroke-width="2"/>
  <text x="840" y="92" font-size="17" font-weight="700" fill="#000000">c &#160; Three-layer cascade</text>
  <text x="840" y="120" font-size="14"><tspan fill="#9C7A3E" font-weight="700">Sensory</tspan><tspan fill="#000000">&#160;&#183;&#160;</tspan><tspan fill="#6A2C5A" font-weight="700">Integration</tspan><tspan fill="#000000">&#160;&#183;&#160;</tspan><tspan fill="#B2567E" font-weight="700">Execution</tspan></text>
  <text x="840" y="142" font-size="14" fill="#000000">standardized score vs reference</text>
  <text x="840" y="164" font-size="14" fill="#000000">lowest layer &#8594; archetype</text>

  <!-- ===================== outputs (real app plots) ===================== -->
  <text x="24" y="214" font-size="17" font-weight="700" fill="#000000">What you get &#8212; live outputs from the bundled example data</text>

  <!-- d Gene drivers: full-width cascade tree -->
  <rect x="24" y="228" width="1152" height="486" rx="8" fill="#ffffff" stroke="#6A2C5A" stroke-width="2"/>
  <text x="44" y="256" font-size="16" font-weight="700" fill="#000000">d &#160; Gene drivers &#8212; per-patient cascade tree (98 genes &#8594; sub-modules &#8594; layers)</text>
  <image xlink:href="fig_tree.png" x="36" y="268" width="1128" height="435"/>

  <!-- e Patient report: gauge -->
  <rect x="24" y="734" width="568" height="256" rx="8" fill="#ffffff" stroke="#6A2C5A" stroke-width="2"/>
  <text x="44" y="762" font-size="16" font-weight="700" fill="#000000">e &#160; Patient report &#8212; three-layer gauge</text>
  <image xlink:href="fig_gauge.png" x="36" y="776" width="544" height="201"/>

  <!-- f Cohort explorer: archetype mix + layer distributions -->
  <rect x="608" y="734" width="568" height="256" rx="8" fill="#ffffff" stroke="#6A2C5A" stroke-width="2"/>
  <text x="628" y="762" font-size="16" font-weight="700" fill="#000000">f &#160; Cohort explorer &#8212; archetype mix &amp; layer scores</text>
  <image xlink:href="fig_cohort.png" x="628" y="782" width="528" height="182"/>

  <!-- footer -->
  <line x1="24" y1="1008" x2="1176" y2="1008" stroke="#e5e5e5" stroke-width="1"/>
  <text x="24" y="1026" font-size="12.5" fill="#000000"><tspan font-weight="700" fill="#6A2C5A">Reproducible:</tspan> frozen, versioned reference &#183; deterministic, cohort-independent scoring. &#160;&#160;<tspan font-weight="700" fill="#9C7A3E">Research use only</tspan> &#8212; not a validated clinical test.</text>
</svg>
