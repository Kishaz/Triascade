<svg xmlns="http://www.w3.org/2000/svg" width="440" height="132" viewBox="0 0 440 132"
     font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <!-- CascadeScope lockup: fading-cascade mark + wordmark + calligraphic ICI (Immune Cascade Index).
       Text is kept as live <text> (editable in Inkscape/Illustrator); no textLength, one object per label. -->
  <g transform="translate(18,28)">
    <rect width="76" height="76" rx="17" fill="#6A2C5A"/>
    <rect x="18" y="20" width="40" height="9" rx="4.5" fill="#ffffff"/>
    <rect x="18" y="34" width="29" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.78"/>
    <rect x="18" y="48" width="19" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.56"/>
  </g>
  <text x="110" y="62" font-size="38" font-weight="800"><tspan fill="#6A2C5A">Cascade</tspan><tspan fill="#9C7A3E">Scope</tspan></text>
  <text x="112" y="104" font-size="29" font-style="italic" fill="#6A2C5A"
        font-family="'Snell Roundhand','Apple Chancery','Segoe Script','Brush Script MT',cursive">Immune Cascade Index</text>
</svg>
